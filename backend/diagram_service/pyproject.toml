[project]
name = "diagram-service"
version = "25.16.0"
description = "Architecture diagram Django API service"
requires-python = ">=3.10,<3.14"
dependencies = [
    "awscli>=1.42.14",
    "celery[gevent]>=5.5.3",
    "channels>=4.3.1",
    "colorlog>=6.9.0",
    "daphne>=4.2.1",
    "django>=5.2.5",
    "django-cors-headers>=4.7.0",
    "django-redis>=6.0.0",
    "djangorestframework>=3.16.1",
    "djongo>=1.2.31",
    "drf-yasg>=1.21.10",
    "gevent>=25.5.1",
    "greenlet>=3.2.4",
    "hiredis>=3.2.1",
    "honcho>=2.0.0",
    "pymupdf>=1.24.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "python-hcl2>=7.3.1",
    "setuptools>=80.9.0",
    "engine-libs",
    "shared-libs",
    "uvicorn[standard]>=0.44.0",
    "wheel>=0.45.1",
    "zope-event>=6.0",
    "zope-interface>=8.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "httpx>=0.27.0",
    "mypy>=1.18.1",
    "pytest-asyncio>=1.2.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=4.0.0",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.12.0",
    "pytest>=8.4.2",
    "import-linter>=2.11",
]



[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/venv/*", "*/env/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
extend = "../ruff.toml"

[tool.uv.workspace]
members = [
    "service/tasks/database",
    "service/tasks/database_log",
]

[tool.uv.sources]
diagram-libs = { path = "../modules/diagram_libs", editable = true }
engine-libs = { path = "../modules/engine_libs", editable = true }
shared-libs = { path = "../modules/shared_libs", editable = true }
