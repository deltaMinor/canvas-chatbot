<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Swagger</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      type="text/css"
      href="/static/swagger/swagger-ui.css"
    />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="/static/swagger/swagger-ui-bundle.js"></script>
    <script>
      async function loadSwaggerUI(SERVER_HOST,SERVER_PORT) {
        try {
          const response = await fetch('/static/data/swagger.json');
          if (!response.ok) {
            throw new Error(
              'Network response was not ok ' + response.statusText,
            );
          }
          const json_data = await response.json(); // Get the JSON data
          const jsonString = JSON.stringify(json_data);
          const newJsonString = jsonString.replace("[[SERVER_HOST]]", SERVER_HOST).replace("[[SERVER_PORT]]", SERVER_PORT);
          const newJsonData = JSON.parse(newJsonString);

          const ui = SwaggerUIBundle({
            spec: newJsonData, // Use the fetched JSON data
            dom_id: '#swagger-ui',
            presets: [
              SwaggerUIBundle.presets.apis,
              SwaggerUIBundle.SwaggerUIStandalonePreset,
            ],
            layout: 'BaseLayout',
            requestInterceptor: (request) => {
              request.headers['X-CSRFToken'] = '{{ csrf_token }}'; // Ensure CSRF token is set
              return request;
            },
          });
        } catch (error) {
          console.error('There was an error fetching the Swagger JSON:', error);
        }
      }

      // console.log({SERVER_HOST: "{{SERVER_HOST}}"})
      // console.log({SERVER_PORT: "{{SERVER_PORT}}"})
      loadSwaggerUI("{{SERVER_HOST}}","{{SERVER_PORT}}"); // Call the function to load Swagger UI
    </script>
  </body>
</html>
