<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Swagger</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="stylesheet"
            type="text/css"
            href="{{URL_PREFIX}}swagger/swagger-ui.css"
        />
    </head>
    <body>
        <div id="swagger-ui"></div>
        <script src="{{URL_PREFIX}}swagger/swagger-ui-bundle.js"></script>
        <script>
            async function loadSwaggerUI() {
                const host = window.location.hostname;
                const port = window.location.port;
                const hostPort = port ? `${host}:${port}` : host;
                try {
                    const response = await fetch(
                        "{{URL_PREFIX}}data/swagger.json"
                    );
                    if (!response.ok) {
                        throw new Error(
                            "Network response was not ok " + response.statusText
                        );
                    }
                    const json_data = await response.json(); // Get the JSON data
                    const jsonString = JSON.stringify(json_data);
                    const newJsonString = jsonString
                        .replace(/\[\[SERVER_HOST\]\]:\[\[SERVER_PORT\]\]/g, hostPort)
                        .replace(/\[\[SERVER_HOST\]\]/g, host)
                        .replace(/\[\[SERVER_PORT\]\]/g, port);
                    const newJsonData = JSON.parse(newJsonString);

                    const ui = SwaggerUIBundle({
                        spec: newJsonData, // Use the fetched JSON data
                        dom_id: "#swagger-ui",
                        presets: [
                            SwaggerUIBundle.presets.apis,
                            SwaggerUIBundle.SwaggerUIStandalonePreset,
                        ],
                        layout: "BaseLayout",
                        requestInterceptor: (request) => {
                            return request;
                        },
                    });
                } catch (error) {
                    console.error(
                        "There was an error fetching the Swagger JSON:",
                        error
                    );
                }
            }

            loadSwaggerUI(); // Call the function to load Swagger UI
        </script>
    </body>
</html>
