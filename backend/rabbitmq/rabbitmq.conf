# RabbitMQ's default `guest` account is restricted to loopback-only
# connections (a security default). When RabbitMQ runs inside this
# project's Docker container and a client connects via the host-forwarded
# port (e.g. the backend running natively via `uv run` on the host, or even
# another container), RabbitMQ sees that connection arriving from the
# Docker network gateway rather than genuine loopback, and refuses it with
# "ACCESS_REFUSED ... Login was refused using authentication mechanism
# PLAIN" even though the guest/guest credentials are correct.
#
# This is a demo/local-dev environment (not production), so we simply lift
# that restriction rather than provision a separate non-guest user.
loopback_users = none
